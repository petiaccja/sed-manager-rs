[workspace]
resolver = "2"
members = [
    "sed_manager",
    "sed_manager_macros",
    #"sed_manager_config",
    #"sed_manager_config_ui",
    #"sed_manager_unlock",
    "as_array",
    "as_array_macros",
    "sed_packet",
    "sed_spec",
    "sed_spec_macros",
    "sed_spec_codegen",
    "sed_device",
    "sed_tper",
    "sed_async_runtime",
    "sed_telemetry", "sed_virtual_device",
]

[workspace.dependencies]

# Workspace packages.
sed_async_runtime = { version = "0.1.0", path = "sed_async_runtime" }
sed_device = { version = "0.1.0", path = "sed_device" }
sed_packet = { version = "0.1.0", path = "sed_packet" }
sed_spec = { version = "0.1.0", path = "sed_spec" }
sed_spec_codegen = { version = "0.1.0", path = "sed_spec_codegen" }
sed_spec_macros = { version = "0.1.0", path = "sed_spec_macros" }
sed_telemetry = { version = "0.1.0", path = "sed_telemetry" }
sed_tper = { version = "0.1.0", path = "sed_tper" }
sed_tper_macros = { version = "0.1.0", path = "sed_tper_macros" }
sed_virtual_device = { version = "0.1.0", path = "sed_virtual_device" }

# Maintained by Peter.
sorbit = { version = "0.1.2", git = "https://github.com/petiaccja/sorbit", rev = "837a33d37ca6cdaed88f897e3db780707a4508f1" }

# Third-party packages.
# -- Async
tokio = { version = "1.51.1", features = ["rt-multi-thread"] }
oneshot = { version = "0.2.1", features = ["async"] }
async-channel = { version = "2.5.0" }
pin-project = "1.1.11"

# -- Data structures
thiserror = { version = "2.0.18" }
smallvec = { version = "1.15.1", features = ["const_generics"] }
num_enum = { version = "0.7.6" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }

# -- Code generation
quote = { version = "1.0.45" }
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
proc-macro2 = { version = "1.0.106" }
prettyplease = { version = "0.2.37" }

# -- Operating systems
winapi = { version = "0.3.9", default-features = false, features = [
    "std",
    "ioapiset",
    "errhandlingapi",
    "fileapi",
    "winnt",
    "handleapi",
    "winioctl",
    "wbemcli",
    "combaseapi",
    "oleauto",
    "winbase",
    "ntddscsi",
] }
nix = { version = "0.29", default-features = false, features = ["fs", "ioctl"] }

# -- Testing
rstest = { version = "0.26.1" }
googletest = { version = "0.14.2" }

# -- Tracing
tracing = { version = "0.1.44" }
tracing-subscriber = "0.3.23"
tracing-opentelemetry = "0.32.1"
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31.1", features = [
    "grpc-tonic",
    "gzip-tonic",
    "tls-roots",
    "trace",
    "gzip-http",
] }
tonic = { version = "0.14.5", features = ["tls-native-roots", "gzip"] }
