[package]
name = "sed_manager"
version = "0.1.1"
edition = "2024"

[package.metadata]
build = "build.rs"

[dependencies]
sed_packet.workspace = true
sed_manager_macros = { path = "../sed_manager_macros" }
as_array = { path = "../as_array" }
sorbit.workspace = true
num_enum = { version = "0.7.5" }
winapi = { version = "0.3.9", default-features = false, features = [
    "std",
    "ioapiset",
    "errhandlingapi",
    "fileapi",
    "winnt",
    "handleapi",
    "winioctl",
    "wbemcli",
    "combaseapi",
    "oleauto",
    "winbase",
    "ntddscsi",
] }
nix = { version = "0.29", default-features = false, features = ["fs", "ioctl"] }
thiserror = { version = "1.0.66" }
tokio = { version = "1.41.0", default-features = false, features = [
    "rt",
    "sync",
    "rt-multi-thread",
    "time",
    "macros",
] }
tokio-util = { version = "0.7.14", default-features = false, features = ["rt"] }
tracing = { version = "0.1.41" }

[build-dependencies]
quote = "1.0.37"
proc-macro2 = "1.0.89"
serde_json = "1.0.138"
