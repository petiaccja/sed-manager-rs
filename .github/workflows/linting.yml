name: linting
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  run-clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98
          rustup default 1.98

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run clippy
        run: |
          cargo clippy --check
